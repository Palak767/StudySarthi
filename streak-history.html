<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Learning Streak — StudySarthi</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/streak-utils.js"></script>
<style>
  .streak-page{ padding:0; }
  .streak-hero{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    padding:28px;
    display:flex;
    align-items:center;
    gap:24px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .streak-hero .big-num{
    font-family:var(--font-mono);
    font-size:2.6rem;
    font-weight:600;
    color:var(--coral);
    line-height:1;
  }
  .streak-hero .stat-block{ text-align:center; }
  .streak-hero .stat-block .lbl{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .streak-hero .divider{
    width:1px;
    height:50px;
    background:var(--border);
  }
  .calendar-card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    padding:28px;
    margin-bottom:28px;
    overflow-x:auto;
  }
  .calendar-card h2{
    font-family:var(--font-display);
    font-size:1.1rem;
    margin-bottom:18px;
  }
  .cal-grid{
    display:grid;
    grid-auto-flow:column;
    grid-template-rows:repeat(7, 14px);
    gap:4px;
    width:max-content;
  }
  .cal-cell{
    width:14px;
    height:14px;
    border-radius:3px;
    background:var(--paper);
    border:1px solid var(--border);
  }
  .cal-cell[data-level="1"]{ background:rgba(255,111,89,.35); border-color:transparent; }
  .cal-cell[data-level="2"]{ background:var(--coral); border-color:transparent; }
  .cal-legend{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    font-size:0.72rem;
    color:var(--ink-soft);
  }
  .cal-legend .cal-cell{ width:12px; height:12px; }
  .history-card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);
    padding:28px;
  }
  .history-card h2{
    font-family:var(--font-display);
    font-size:1.1rem;
    margin-bottom:16px;
  }
  .history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
    font-size:0.88rem;
  }
  .history-row:last-child{ border-bottom:none; }
  .history-row .len{
    font-family:var(--font-mono);
    color:var(--teal);
    font-weight:600;
  }
  .history-row.broken .len{ color:var(--coral); }
  .empty-state{
    text-align:center;
    padding:30px;
    color:var(--ink-soft);
  }
  .back-row{ margin-bottom:24px; }
  .back-row a{
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.9rem;
    color:var(--ink-soft);
  }
  .back-row a:hover{ color:var(--coral); }
</style>
</head>
<body>
<div class="dashboard-layout">
    <aside class="sidebar">
        <h2 class="logo">
            <svg class="icon icon-accent" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> StudySarthi
        </h2>
        <ul>
            <li><a href="dashboard.html"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a></li>
            <li><a href="index.html"><svg class="icon icon-accent" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg> Home</a></li>
            <li><a href="features/notes.html"><svg class="icon icon-accent" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/></svg> Notes</a></li>
            <li><a href="features/coding-practice.html"><svg class="icon icon-accent" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4M6 8l-4 4 4 4M14.5 4l-5 16"/></svg> Coding Practice</a></li>
            <li><a href="features/internship-tracker.html"><svg class="icon icon-accent" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> Internship Tracker</a></li>
            <li><a href="features/ai-assistant.html"><svg class="icon icon-accent" viewBox="0 0 24 24"><path d="M12 2v3"/><rect x="5" y="7" width="14" height="11" rx="2"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><path d="M9 16h6"/><path d="M3 10h2"/><path d="M19 10h2"/></svg>AI Mentor</a></li>
            <li><a href="settings.html"><svg class="icon icon-accent" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9A1.6 1.6 0 0 0 10 3.2V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.4 1z"/></svg> Settings</a></li>
        </ul>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <h1>Learning Streak</h1>
        </header>

        <div class="streak-page">
          <div class="back-row"><a href="dashboard.html">&larr; Back to Dashboard</a></div>

          <div class="streak-hero">
            <div class="stat-block">
              <div class="big-num" id="current-streak">0</div>
              <div class="lbl">Current Streak</div>
            </div>
            <div class="divider"></div>
            <div class="stat-block">
              <div class="big-num" id="longest-streak" style="color:var(--teal)">0</div>
              <div class="lbl">Longest Streak</div>
            </div>
            <div class="divider"></div>
            <div class="stat-block">
              <div class="big-num" id="total-active-days" style="color:var(--ink)">0</div>
              <div class="lbl">Total Active Days</div>
            </div>
          </div>

          <div class="calendar-card">
            <h2>Last 12 Weeks</h2>
            <div class="cal-grid" id="cal-grid"></div>
            <div class="cal-legend">
              <span>Less</span>
              <div class="cal-cell" data-level="0"></div>
              <div class="cal-cell" data-level="1"></div>
              <div class="cal-cell" data-level="2"></div>
              <span>More</span>
            </div>
          </div>

          <div class="history-card">
            <h2>Streak History</h2>
            <div id="history-list"></div>
          </div>
        </div>
    </main>
</div>

<script>
  function safeLoad(key){
    try{ return JSON.parse(localStorage.getItem(key)) || []; }catch(e){ return []; }
  }
  // A day counts as "active" if you completed a goal OR logged a coding problem that day.
  const goalHistory = safeLoad('studysarthi_goal_history'); // array of ISO date strings
  const codingLog = safeLoad('studysarthi_coding_log');     // array of {date, ...}
  const activeDates = new Set([
    ...goalHistory,
    ...codingLog.map(e => e.date)
  ]);
  // ===== Current streak (reuses streak-utils.js) =====
  document.getElementById('current-streak').textContent = calcStreak(activeDates);
  // ===== Total active days =====
  document.getElementById('total-active-days').textContent = activeDates.size;
  // ===== Longest streak + streak history (consecutive runs) =====
  const sortedDates = [...activeDates].sort();
  const runs = [];
  let currentRun = null;

  sortedDates.forEach(dateStr => {
    const d = new Date(dateStr + 'T00:00:00');
    if(currentRun){
      const prevDate = new Date(currentRun.end + 'T00:00:00');
      const diffDays = Math.round((d - prevDate) / 86400000);
      if(diffDays === 1){
        currentRun.end = dateStr;
        currentRun.length++;
        return;
      }
    }
    currentRun = { start: dateStr, end: dateStr, length: 1 };
    runs.push(currentRun);
  });

  const longestStreak = runs.reduce((max, r) => Math.max(max, r.length), 0);
  document.getElementById('longest-streak').textContent = longestStreak;

  function formatDisplayDate(iso){
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  const historyList = document.getElementById('history-list');
  if(runs.length === 0){
    historyList.innerHTML = `<div class="empty-state">No activity yet — complete a goal or log a coding problem to start your streak.</div>`;
  } else {
    const reversedRuns = [...runs].reverse();
    historyList.innerHTML = reversedRuns.map((run, idx) => {
      const isOngoing = idx === 0 && activeDates.has(new Date().toISOString().slice(0,10));
      const label = run.start === run.end
        ? formatDisplayDate(run.start)
        : `${formatDisplayDate(run.start)} → ${formatDisplayDate(run.end)}`;
      return `
        <div class="history-row ${isOngoing ? '' : 'broken'}">
          <span>${label}</span>
          <span class="len">${run.length} day${run.length === 1 ? '' : 's'}${isOngoing ? ' (ongoing)' : ''}</span>
        </div>
      `;
    }).join('');
  }

  // ===== Contribution calendar (last 84 days, GitHub-style) =====
  const calGrid = document.getElementById('cal-grid');
  const days = [];
  const today = new Date();
  today.setHours(0,0,0,0);

  for(let i = 83; i >= 0; i--){
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0,10);
    days.push(iso);
  }

  calGrid.innerHTML = days.map(iso => {
    const active = activeDates.has(iso);
    const level = active ? 2 : 0;
    return `<div class="cal-cell" data-level="${level}" title="${iso}${active ? ' — active' : ''}"></div>`;
  }).join('');
</script>

</body>
</html>
