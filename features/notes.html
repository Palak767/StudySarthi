<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Notes — StudySarthi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

<style>

body {
  background-color: var(--paper);
}

.feature-header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 20px 0;
}

.feature-header .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.back-link {
  font-family: var(--font-body);
  font-weight: 600;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  gap: 6px;
}

.back-link:hover { color: var(--coral); }

.notes-page { padding: 48px 0 80px; }

.notes-intro {
  max-width: 650px;
  margin-bottom: 36px;
}

.notes-intro .eyebrow {
  font-family: var(--font-mono);
  font-size: .75rem;
  text-transform: uppercase;
  color: var(--coral);
  margin-bottom: 8px;
}

.notes-intro h1 {
  font-family: var(--font-display);
  font-size: 2.2rem;
  margin-bottom: 10px;
}

.notes-intro p {
  color: var(--ink-soft);
  line-height: 1.6;
}

.storage-note {
  display: inline-flex;
  margin-top: 15px;
  padding: 7px 14px;
  border-radius: 999px;
  background: var(--white);
  border: 1px dashed var(--border);
  font-family: var(--font-mono);
  font-size: .72rem;
}

.notes-layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 28px;
}

.composer {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow-sm);
  position: sticky;
  top: 20px;
}

.composer h2 {
  font-family: var(--font-display);
  font-size: 1.1rem;
  margin-bottom: 18px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 15px;
}

.field label {
  font-size: .78rem;
  font-weight: 600;
  color: var(--ink-soft);
}

.field input,
.field textarea {
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--paper);
  font-family: var(--font-body);
  outline: none;
}

.field textarea {
  min-height: 120px;
  resize: vertical;
}

.field input:focus,
.field textarea:focus { border-color: var(--coral); }

.save-btn {
  width: 100%;
  padding: 12px;
  border: none;
  background: var(--coral);
  color: white;
  border-radius: var(--radius-sm);
  font-family: var(--font-display);
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
}

.save-btn:hover { transform: translateY(-1px); }

.save-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.notes-main-top {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}

.search-input,
.filter-select {
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: white;
  font-family: var(--font-body);
}

.search-input { flex: 1; }

.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.note-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.15s;
}

.note-card:hover { transform: translate(-2px, -2px); }

.note-tag {
  background: rgba(255, 111, 89, .12);
  color: var(--coral);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: .68rem;
  width: max-content;
  font-family: var(--font-mono);
}

.note-card h3 { font-family: var(--font-display); }

.note-card p {
  color: var(--ink-soft);
  font-size: .85rem;
  line-height: 1.5;
}

.note-card-footer {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
}

.note-date {
  font-family: var(--font-mono);
  font-size: .7rem;
}

.note-actions button {
  border: none;
  background: none;
  cursor: pointer;
  font-weight: 600;
}

.edit-btn:hover   { color: var(--teal); }
.delete-btn:hover { color: var(--coral); }

/* EMPTY */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  background: white;
}

/* LOADING */
.loading-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px;
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--coral);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-state p {
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-size: .8rem;
}

/* ERROR */
.error-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px;
  border: 1px solid rgba(255, 111, 89, 0.3);
  border-radius: var(--radius-lg);
  background: rgba(255, 111, 89, 0.04);
}

.error-state p {
  color: var(--coral);
  font-family: var(--font-mono);
  font-size: .82rem;
  margin-bottom: 12px;
}

.retry-btn {
  padding: 8px 20px;
  border: 1px solid var(--coral);
  background: transparent;
  color: var(--coral);
  border-radius: var(--radius-sm);
  font-family: var(--font-display);
  font-size: .82rem;
  cursor: pointer;
}

.retry-btn:hover {
  background: var(--coral);
  color: white;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: .78rem;
  color: white;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  z-index: 999;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

.toast.success { background: #16a34a; }
.toast.error   { background: var(--coral); }

@media (max-width: 800px) {
  .notes-layout { grid-template-columns: 1fr; }
  .composer { position: static; }
}

</style>
</head>

<body>

<header class="feature-header">
  <div class="container">
    <a href="../index.html" class="logo">StudySarthi</a>
    <a href="../index.html#features" class="back-link">← Back to Features</a>
  </div>
</header>

<main class="notes-page">
  <div class="container">

    <div class="notes-intro">
      <p class="eyebrow">Feature · Smart Notes</p>
      <h1>Keep every subject in one place</h1>
      <p>Write, organize and access your study notes easily. Your notes are synced with StudySarthi backend.</p>
      <span class="storage-note">☁️ Synced with StudySarthi API</span>
    </div>

    <div class="notes-layout">

      <!-- FORM -->
      <div class="composer">
        <h2 id="composer-title">New Note</h2>
        <form id="note-form">
          <input type="hidden" id="edit-id">

          <div class="field">
            <label>Title</label>
            <input id="note-title" type="text" placeholder="Operating System Notes" required>
          </div>

          <div class="field">
            <label>Subject</label>
            <input id="note-subject" type="text" placeholder="OS" required>
          </div>

          <div class="field">
            <label>Content</label>
            <textarea id="note-content" placeholder="Write your notes..." required></textarea>
          </div>

          <button class="save-btn" id="save-btn">Save Note</button>
        </form>
      </div>

      <!-- NOTES DISPLAY -->
      <div class="notes-main">
        <div class="notes-main-top">
          <input id="search-input" class="search-input" placeholder="Search notes...">
          <select id="filter-select" class="filter-select">
            <option value="">All Subjects</option>
          </select>
        </div>
        <div id="notes-grid" class="notes-grid"></div>
      </div>

    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const API_URL = "https://studysarthi-ai-yrol.onrender.com/api/notes";

// ─── STATE ────────────────────────────────────────────────────────────────────
let notes     = [];
let isLoading = false;

// ─── DOM REFS ─────────────────────────────────────────────────────────────────
const form          = document.getElementById("note-form");
const grid          = document.getElementById("notes-grid");
const searchInput   = document.getElementById("search-input");
const filterSelect  = document.getElementById("filter-select");
const titleInput    = document.getElementById("note-title");
const subjectInput  = document.getElementById("note-subject");
const contentInput  = document.getElementById("note-content");
const editId        = document.getElementById("edit-id");
const composerTitle = document.getElementById("composer-title");
const saveBtn       = document.getElementById("save-btn");
const toastEl       = document.getElementById("toast");


// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(message, type = "success") {
  toastEl.textContent = message;
  toastEl.className   = `toast ${type} show`;
  setTimeout(() => { toastEl.className = "toast"; }, 3000);
}


// ─── FETCH NOTES ──────────────────────────────────────────────────────────────
async function fetchNotes() {
  isLoading = true;
  renderGrid(); // show spinner immediately

  try {
    const response = await fetch(API_URL);

    if (!response.ok) throw new Error(`Server error: ${response.status}`);

    const result = await response.json();
    notes = result.data || [];

    refreshSubjectFilter();

  } catch (error) {
    console.error("Fetch error:", error);
    isLoading = false;
    renderError();
    return;
  }

  isLoading = false;
  renderGrid();
}


// ─── CREATE / UPDATE NOTE ─────────────────────────────────────────────────────
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const noteData = {
    title:   titleInput.value.trim(),
    subject: subjectInput.value.trim(),
    content: contentInput.value.trim()
  };

  const isEditing      = !!editId.value;
  saveBtn.disabled     = true;
  saveBtn.textContent  = isEditing ? "Updating..." : "Saving...";

  try {
    const url     = isEditing ? `${API_URL}/${editId.value}` : API_URL;
    const method  = isEditing ? "PUT" : "POST";

    const response = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(noteData)
    });

    if (!response.ok) throw new Error(`Server error: ${response.status}`);

    showToast(isEditing ? "Note updated!" : "Note saved!");
    resetForm();
    fetchNotes();

  } catch (error) {
    console.error("Save error:", error);
    showToast("Failed to save note. Try again.", "error");
    saveBtn.disabled    = false;
    saveBtn.textContent = isEditing ? "Update Note" : "Save Note";
  }
});


// ─── DELETE NOTE ──────────────────────────────────────────────────────────────
window.deleteNote = async function (id) {
  if (!confirm("Delete this note?")) return;

  try {
    const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });
    if (!response.ok) throw new Error(`Server error: ${response.status}`);
    showToast("Note deleted.");
    fetchNotes();
  } catch (error) {
    console.error("Delete error:", error);
    showToast("Failed to delete note.", "error");
  }
};


// ─── EDIT NOTE ────────────────────────────────────────────────────────────────
window.editNote = function (id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;

  titleInput.value   = note.title   || "";
  subjectInput.value = note.subject || "";
  contentInput.value = note.content || "";
  editId.value       = note.id;

  composerTitle.textContent = "Edit Note";
  saveBtn.textContent       = "Update Note";

  document.querySelector(".composer").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
};


// ─── RENDER GRID ──────────────────────────────────────────────────────────────
function renderGrid() {

  if (isLoading) {
    grid.innerHTML = `
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Fetching your notes...</p>
      </div>`;
    return;
  }

  const query   = searchInput.value.toLowerCase();
  const subject = filterSelect.value;

  const filtered = notes.filter(note => {
    const matchSubject = !subject || note.subject === subject;
    const matchSearch  = !query  ||
      (note.title + note.subject + (note.content || ""))
      .toLowerCase().includes(query);
    return matchSubject && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <p style="color:var(--ink-soft);font-size:.9rem;">
          ${notes.length === 0
            ? "No notes yet — create your first one!"
            : "No notes match your search."}
        </p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(note => `
    <div class="note-card">
      <span class="note-tag">${escapeHtml(note.subject || "General")}</span>
      <h3>${escapeHtml(note.title)}</h3>
      <p>${escapeHtml(note.content || "No content available")}</p>
      <div class="note-card-footer">
        <span class="note-date">${formatDate(note.createdAt)}</span>
        <div class="note-actions">
          <button class="edit-btn"   onclick="editNote('${note.id}')">Edit</button>
          <button class="delete-btn" onclick="deleteNote('${note.id}')">Delete</button>
        </div>
      </div>
    </div>
  `).join("");
}


// ─── ERROR STATE ──────────────────────────────────────────────────────────────
function renderError() {
  grid.innerHTML = `
    <div class="error-state">
      <p>⚠ Could not connect to the backend. Check your connection or try again.</p>
      <button class="retry-btn" onclick="fetchNotes()">Retry</button>
    </div>`;
}


// ─── SUBJECT FILTER ───────────────────────────────────────────────────────────
function refreshSubjectFilter() {
  const subjects = [...new Set(notes.map(n => n.subject).filter(Boolean))];
  filterSelect.innerHTML = `
    <option value="">All Subjects</option>
    ${subjects.map(s => `<option value="${s}">${escapeHtml(s)}</option>`).join("")}
  `;
}


// ─── HELPERS ──────────────────────────────────────────────────────────────────

// Handles plain strings, ISO dates, and Firestore Timestamp objects
function formatDate(date) {
  if (!date) return "Recently";
  if (date._seconds) return new Date(date._seconds * 1000).toLocaleDateString();
  const parsed = new Date(date);
  return isNaN(parsed) ? "Recently" : parsed.toLocaleDateString();
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text || "";
  return div.innerHTML;
}

function resetForm() {
  form.reset();
  editId.value             = "";
  composerTitle.textContent = "New Note";
  saveBtn.textContent      = "Save Note";
  saveBtn.disabled         = false;
}


// ─── LISTENERS ────────────────────────────────────────────────────────────────
searchInput.addEventListener("input", renderGrid);
filterSelect.addEventListener("change", renderGrid);


// ─── INIT ─────────────────────────────────────────────────────────────────────
fetchNotes();

</script>

</body>
</html>
